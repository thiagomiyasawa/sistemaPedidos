[project]
name = "monitorkpi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dependency-injector>=4.49.1",
    "dotenv>=0.9.9",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pyside6>=6.12.0",
    "uvicorn>=0.30",
]

[project.scripts]
monitorkpi = "monitorkpi:main"
monitorkpi-tudo = "monitorkpi.iniciar:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
